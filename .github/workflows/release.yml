name: Build & Release multi-plateformes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # Android : APK universel signé (Android 5.0 → 16)
  # ------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (paquets + licences)
        run: |
          SDKM=$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.4.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionName=${{ env.VERSION }} -PappVersionCode=${{ env.CODE }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "QuizRevise-Android-v${{ env.VERSION }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: QuizRevise-Android-*.apk

  # ------------------------------------------------------------
  # Windows 10/11 : INSTALLATEUR .exe (WiX) — installe l'app dans
  # le système, crée les raccourcis Bureau + menu Démarrer,
  # entrée « Applications » pour la désinstallation, JRE embarqué
  # ------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.4.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install WiX 3.14 (requis par jpackage --type exe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile wix-bin.zip
          Expand-Archive -Path wix-bin.zip -DestinationPath wix314-binaries

      - name: Build fat jar
        shell: pwsh
        run: ./gradlew.bat :desktop:jar --no-daemon "-PappVersionName=${{ env.VERSION }}"

      - name: Build Windows installer (.exe)
        shell: pwsh
        run: |
          Copy-Item "desktop/build/libs/desktop-${{ env.VERSION }}.jar" "desktop/build/libs/quizrevise.jar"
          $env:PATH = "$PWD/wix314-binaries;$env:PATH"
          & "$env:JAVA_HOME/bin/jpackage.exe" --type exe --name QuizRevise `
            --app-version "${{ env.VERSION }}" --vendor TEAR36 `
            --description "App de révision type Quizlet : flashcards, QCM, stats" `
            --input "desktop/build/libs" --main-jar quizrevise.jar `
            --icon desktop/quizrevise.ico `
            --win-menu --win-shortcut --win-dir-chooser `
            --win-upgrade-uuid 381c7875-31dc-41ec-a229-5a40fcf556f0 `
            --dest dist
          Move-Item "dist/QuizRevise-${{ env.VERSION }}.exe" "QuizRevise-Windows-Setup-v${{ env.VERSION }}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: QuizRevise-Windows-Setup-*.exe

  # ------------------------------------------------------------
  # Linux : .deb (Debian/Ubuntu/Mint) + archive générique (Fedora & co)
  # ------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.4.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build fat jar
        run: ./gradlew :desktop:jar --no-daemon "-PappVersionName=${{ env.VERSION }}"

      - name: Package generic archive (app-image)
        run: |
          cp "desktop/build/libs/desktop-${{ env.VERSION }}.jar" "desktop/build/libs/quizrevise.jar"
          "$JAVA_HOME/bin/jpackage" --type app-image --name QuizRevise \
            --app-version "${{ env.VERSION }}" --input desktop/build/libs \
            --main-jar quizrevise.jar --icon desktop/quizrevise.png --dest dist
          tar -czf "QuizRevise-Linux-v${{ env.VERSION }}.tar.gz" -C dist QuizRevise

      - name: Package .deb (Debian/Ubuntu/Mint)
        run: |
          "$JAVA_HOME/bin/jpackage" --type deb --name quizrevise \
            --app-version "${{ env.VERSION }}" --vendor TEAR36 \
            --description "App de révision type Quizlet : flashcards, QCM, stats" \
            --input desktop/build/libs \
            --main-jar quizrevise.jar --icon desktop/quizrevise.png --dest dist-deb
          mv dist-deb/*.deb "QuizRevise-Linux-deb-v${{ env.VERSION }}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            QuizRevise-Linux-*.tar.gz
            QuizRevise-Linux-deb-*.deb

  # ------------------------------------------------------------
  # iOS : IPA non signée (à sideloader — voir README)
  # ------------------------------------------------------------
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.4.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (non signé)
        run: |
          cd ios
          xcodebuild -project QuizRevise.xcodeproj -scheme QuizRevise \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuizRevise.app Payload/
          zip -qry "QuizRevise-iOS-unsigned-v${{ env.VERSION }}.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/QuizRevise-iOS-unsigned-*.ipa

  # ------------------------------------------------------------
  # Release GitHub unique avec tous les assets
  # ------------------------------------------------------------
  release:
    needs: [android, windows, linux, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pour lire le CHANGELOG.md)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extraire la section du changelog pour cette version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            BEGIN { target = "## [" ver "]" }
            index($0, target) == 1 { flag=1; next }
            /^## \[/ && flag { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Section absente du CHANGELOG.md pour $VERSION — notes générées par GitHub uniquement." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          body_path: release-notes.md
          generate_release_notes: true
          overwrite_files: true
