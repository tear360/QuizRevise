name: Build & Release multi-plateformes

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # Android : APK universel signé (Android 5.0 → 16)
  # ------------------------------------------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK (paquets + licences)
        run: |
          SDKM=$(ls -1 "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.1.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release APK
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionName=${{ env.VERSION }} -PappVersionCode=${{ env.CODE }}

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "QuizRevise-Android-v${{ env.VERSION }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: QuizRevise-Android-*.apk

  # ------------------------------------------------------------
  # Windows 10/11 : application autonome (JRE embarqué via jpackage)
  # ------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.1.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build fat jar
        shell: pwsh
        run: ./gradlew.bat :desktop:jar --no-daemon "-PappVersionName=${{ env.VERSION }}"

      - name: Package with jpackage (app-image)
        shell: pwsh
        run: |
          Copy-Item "desktop/build/libs/desktop-${{ env.VERSION }}.jar" "desktop/build/libs/quizrevise.jar"
          & "$env:JAVA_HOME/bin/jpackage.exe" --type app-image --name QuizRevise `
            --app-version "${{ env.VERSION }}" --input "desktop/build/libs" `
            --main-jar quizrevise.jar --dest dist
          Compress-Archive -Path "dist/QuizRevise" -DestinationPath "QuizRevise-Windows-v${{ env.VERSION }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: QuizRevise-Windows-*.zip

  # ------------------------------------------------------------
  # Linux : .deb (Debian/Ubuntu/Mint) + archive générique (Fedora & co)
  # ------------------------------------------------------------
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.1.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build fat jar
        run: ./gradlew :desktop:jar --no-daemon "-PappVersionName=${{ env.VERSION }}"

      - name: Package generic archive (app-image)
        run: |
          cp "desktop/build/libs/desktop-${{ env.VERSION }}.jar" "desktop/build/libs/quizrevise.jar"
          "$JAVA_HOME/bin/jpackage" --type app-image --name QuizRevise \
            --app-version "${{ env.VERSION }}" --input desktop/build/libs \
            --main-jar quizrevise.jar --dest dist
          tar -czf "QuizRevise-Linux-v${{ env.VERSION }}.tar.gz" -C dist QuizRevise

      - name: Package .deb (Debian/Ubuntu/Mint)
        run: |
          "$JAVA_HOME/bin/jpackage" --type deb --name quizrevise \
            --app-version "${{ env.VERSION }}" --input desktop/build/libs \
            --main-jar quizrevise.jar --dest dist-deb
          mv dist-deb/*.deb "QuizRevise-Linux-deb-v${{ env.VERSION }}.deb"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            QuizRevise-Linux-*.tar.gz
            QuizRevise-Linux-deb-*.deb

  # ------------------------------------------------------------
  # iOS : IPA non signée (à sideloader — voir README)
  # ------------------------------------------------------------
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Compute version
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="1.1.${GITHUB_RUN_NUMBER}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (non signé)
        run: |
          cd ios
          xcodebuild -project QuizRevise.xcodeproj -scheme QuizRevise \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/QuizRevise.app Payload/
          zip -qry "QuizRevise-iOS-unsigned-v${{ env.VERSION }}.ipa" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/QuizRevise-iOS-unsigned-*.ipa

  # ------------------------------------------------------------
  # Release GitHub unique avec tous les assets
  # ------------------------------------------------------------
  release:
    needs: [android, windows, linux, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
